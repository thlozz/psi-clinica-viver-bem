name: Validar documentação
on:
  push:
  pull_request:
jobs:
  validar-politica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar rastreabilidade
        run: python scripts/validar_rastreabilidade.py
      - name: Validar links locais
        run: python scripts/validar_links.py
      - name: Validar links externos
        uses: lycheeverse/lychee-action@v2
        with:
          args: '--no-progress --accept 200,206,429 --max-retries 2 --timeout 20 README.md PSI_Clinica_Viver_Bem_v1.2.md anexos/*.md'
          fail: true
      - name: Verificar estilo Markdown
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: '**/*.md'
